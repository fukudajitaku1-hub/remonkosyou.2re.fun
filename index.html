<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>えっちゃんのレモン胡椒</title>
<style>
  :root {
    --bg: #0f1115;
    --bg-soft: #171a21;
    --fg: #f5f6f8;
    --fg-muted: #9aa1ac;
    --accent: #f2b84b;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f6f8;
      --bg-soft: #ffffff;
      --fg: #16181d;
      --fg-muted: #5b616c;
      --accent: #b9750f;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, -apple-system, sans-serif;
    padding: 24px;
  }
  .card {
    background: var(--bg-soft);
    border-radius: 20px;
    padding: 56px 40px;
    max-width: 480px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
  }
  .icon {
    max-width: 240px;
    width: 60%;
    height: auto;
    margin-bottom: 20px;
  }
  .badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    padding: 4px 12px;
    border-radius: 999px;
    margin-bottom: 16px;
  }
  p {
    font-size: 15px;
    color: var(--fg-muted);
    line-height: 1.7;
    margin: 0;
  }
  .bar {
    width: 100%;
    height: 6px;
    border-radius: 999px;
    background: rgba(128, 128, 128, 0.2);
    margin: 24px 0;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    width: 35%;
    border-radius: 999px;
    background: var(--accent);
  }
  .notice {
    font-size: 16px;
    font-weight: 700;
    color: var(--fg);
    margin-bottom: 8px;
  }
  .domain {
    margin-top: 24px;
    font-size: 12px;
    color: var(--fg-muted);
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
  <main class="card">
    <img class="icon" src="images/lemon-kosho.jpg" alt="えっちゃんのレモンゴショウ">
    <div class="badge">🚧 工事中</div>
    <div class="bar"><div class="bar-fill"></div></div>
    <p class="notice">すみません。レシピ例は只今準備中です。</p>
    <div class="domain">remonkosyou.2re.fun</div>
  </main>
</body>
</html>
